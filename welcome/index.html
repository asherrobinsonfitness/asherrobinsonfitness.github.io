  <style>
    /* Self-hosted Inter (SIL Open Font License) — same font on every device (Apple, Android, Windows) */
    @font-face{
      font-family:'Inter';
      font-style:normal;
      font-weight:100 900;
      font-display:swap;
      src:url('../fonts/inter-latin-variable.woff2') format('woff2');
    }
    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, sans-serif;
    }
    /* Tokens match index.html's root palette exactly, for visual congruence */
    :root {
      --text: #f8fafc;
      --muted: #a8afba;
    }
    /* html gets the same bg as body so mobile overscroll/rubber-banding never
       reveals a mismatched flash behind the short page content. */
    html { background: #1c1c1c; }
    body {
      color: var(--text); background: #1c1c1c; line-height: 1.5; font-size: 16px;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh; min-height: 100dvh;
      /* Top-down flow, not centered: the Calendly embed below is 700px tall,
         so a vertically-centered column would start off-screen. align-items
         still centers the column horizontally. */
      display: flex; flex-direction: column; align-items: center;
      /* Horizontal padding matches index.html's actual mobile hero padding
         (max(1rem, ...) resolves to 1rem below 640px); top padding matches
         index.html's --pad token, bottom keeps the prior --pad-sm value. */
      padding: 2.5rem 1rem 2rem;
    }
    .content { width: 100%; max-width: 472px; text-align: center; }
    /* Order-tracker-style progress card, replacing the old check-icon +
       headline + subheadline block: a bordered panel with a bold status
       line, a smooth continuous fill bar (not segmented), and a checkmark
       + step label bottom-right — matching index.html's card conventions
       (#161616 panel, var(--card-border), 12px radius). */
    :root { --card-border: #3d3d3d; }
    .progress-card {
      background: #161616; border: 1px solid var(--card-border); border-radius: 12px;
      padding: 1.25rem; text-align: left; margin: 0 auto 1.5rem;
    }
    .progress-card__title { font-size: 1.125rem; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 0.25rem; }
    .progress-card__subtitle { font-size: 0.9375rem; color: var(--muted); margin-bottom: 1rem; }
    .progress-card__track { height: 4px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; margin-bottom: 0.625rem; }
    .progress-card__fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #4ade80, #22c55e); }
    .progress-card__steps { display: flex; justify-content: space-between; gap: 0.5rem; font-size: 0.8125rem; color: var(--muted); }
    .progress-card__step { display: flex; align-items: center; gap: 0.25rem; }
    .progress-card__step.is-done { color: #22c55e; }
    .progress-card__check { width: 0.75em; height: 0.75em; flex-shrink: 0; }
    .progress-card__step.is-current { color: var(--text); font-weight: 600; }

    /* ── Light mode — same overrides as index.html ── */
    @media (prefers-color-scheme: light) {
      :root {
        --text: #111111;
        --muted: #4a4a4a;
        --card-border: #d5d5d5;
      }
      html, body { background: #f7f7f7; }
      .progress-card { background: #ffffff; }
      .progress-card__track { background: rgba(0,0,0,.08); }
    }
  </style>

  </div>

  <!-- Calendly inline widget begins -->
  <script type="text/javascript">
    // Auto-forwards this page's ?name=&email= (appended by the Stripe
    // success redirect) straight into the booking form via Calendly's own
    // prefill query params, before widget.js scans the DOM below.
    var params = new URLSearchParams(window.location.search);
    var contactName = params.get('name');
    var contactEmail = params.get('email');
    (function () {
      var el = document.getElementById('calendly-embed');
      var url = el.getAttribute('data-url');
      if (contactName) url += '&name=' + encodeURIComponent(contactName);
      if (contactEmail) url += '&email=' + encodeURIComponent(contactEmail);
      el.setAttribute('data-url', url);
    })();
  </script>
  <script type="text/javascript" src="https://assets.calendly.com/assets/external/widget.js"></script>
  <script type="text/javascript">
    // Redirect to the booked page ourselves the instant Calendly reports a
    // completed booking: a same-origin redirect we trigger from our own
    // script skips any embed-side confirmation interstitial.
    window.addEventListener('message', function (e) {
      if (!e.data || e.data.event !== 'calendly.event_scheduled') return;
      var uri = e.data.payload && e.data.payload.event && e.data.payload.event.uri;
      posthog.capture("onboarding_call_booked", { booking_uri: uri });
      var qs = [];
      if (contactName) qs.push('name=' + encodeURIComponent(contactName));
      if (contactEmail) qs.push('email=' + encodeURIComponent(contactEmail));
      window.location.href = '/welcome/booked/' + (qs.length ? '?' + qs.join('&') : '');
    });
  </script>
  <!-- Calendly inline widget ends -->
</body>
