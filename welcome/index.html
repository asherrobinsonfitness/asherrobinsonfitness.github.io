<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Meta Pixel Code -->
  <script>
  // Shared helpers for Meta Pixel + Conversions API deduplication.
  // Each conversion event gets one event_id shared by both the browser pixel
  // call and the server-side CAPI call so Meta counts it once, not twice.
  function __fbEventId() {
    return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now() + '-' + Math.random().toString(16).slice(2));
  }
  function __fbCookie(name) {
    var m = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
    return m ? m[2] : undefined;
  }
  function __fbCapi(eventName, eventId, customData, userData) {
    try {
      fetch('/api/meta-capi', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        keepalive: true,
        body: JSON.stringify({
          event_name: eventName,
          event_id: eventId,
          event_source_url: window.location.href,
          custom_data: customData || {},
          user_data: Object.assign({ fbp: __fbCookie('_fbp'), fbc: __fbCookie('_fbc') }, userData || {})
        })
      }).catch(function(){});
    } catch (e) {}
  }
  !function(f,b,e,v,n,t,s)
  {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};
  if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
  n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];
  s.parentNode.insertBefore(t,s)}(window, document,'script',
  '/edge/fbevents.js');
  fbq('init', '1575468926630270');
  var __pvEventId = __fbEventId();
  fbq('track', 'PageView', {}, {eventID: __pvEventId});
  __fbCapi('PageView', __pvEventId);
  // Purchase fires from index.html at the moment Stripe confirms the charge
  // (pixel) plus a Stripe webhook -> Meta CAPI (server-side, authoritative) —
  // not from this page. This is just the thank-you/download page now.
  </script>
  <noscript><img height="1" width="1" style="display:none"
  src="/edge/tr?id=1575468926630270&ev=PageView&noscript=1"
  /></noscript>
  <!-- End Meta Pixel Code -->
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
  <title>Payment Complete</title>
  <meta name="description" content="Your coaching is confirmed. Book your onboarding call to get started with Asher Robinson.">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/webp" sizes="32x32" href="/assets/favicon-32x32.webp">
  <link rel="icon" type="image/webp" sizes="16x16" href="/assets/favicon-16x16.webp">
  <link rel="shortcut icon" href="/assets/favicon.jpg">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f7f7f7" media="(prefers-color-scheme: light)">
  <link rel="preload" as="font" type="font/woff2" href="../fonts/inter-latin-variable.woff2" crossorigin>
  <style>
    /* Self-hosted Inter (SIL Open Font License) — same font on every device (Apple, Android, Windows) */
    @font-face{
      font-family:'Inter';
      font-style:normal;
      font-weight:100 900;
      font-display:swap;
      src:url('../fonts/inter-latin-variable.woff2') format('woff2');
    }
    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, sans-serif;
    }
    /* Tokens match index.html's root palette exactly, for visual congruence */
    :root {
      --text: #f8fafc;
      --muted: #a8afba;
    }
    /* html gets the same bg as body so mobile overscroll/rubber-banding never
       reveals a mismatched flash behind the short page content. */
    html { background: #1c1c1c; }
    body {
      color: var(--text); background: #1c1c1c; line-height: 1.5; font-size: 16px;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh; min-height: 100dvh;
      /* Top-down flow, not centered: the Calendly embed below is 700px tall,
         so a vertically-centered column would start off-screen. align-items
         still centers the column horizontally. */
      display: flex; flex-direction: column; align-items: center;
      /* Horizontal padding matches index.html's actual mobile hero padding
         (max(1rem, ...) resolves to 1rem below 640px); top padding matches
         index.html's --pad token, bottom keeps the prior --pad-sm value. */
      padding: 2.5rem 1rem 2rem;
    }
    .content { width: 100%; max-width: 440px; text-align: center; }
    /* Order-tracker-style progress card, replacing the old check-icon +
       headline + subheadline block: a bordered panel with a bold status
       line, a smooth continuous fill bar (not segmented), and a checkmark
       + step label bottom-right — matching index.html's card conventions
       (#161616 panel, var(--card-border), 12px radius). */
    :root { --card-border: #3d3d3d; }
    .progress-card {
      background: #161616; border: 1px solid var(--card-border); border-radius: 12px;
      padding: 1.25rem; text-align: left; margin: 0 auto 1.5rem;
    }
    .progress-card__title { font-size: 1.125rem; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 0.25rem; }
    .progress-card__subtitle { font-size: 0.875rem; color: var(--muted); margin-bottom: 1rem; }
    .progress-card__track { height: 4px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; margin-bottom: 0.625rem; }
    .progress-card__fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #4ade80, #22c55e); }
    .progress-card__steps { display: flex; justify-content: space-between; gap: 0.5rem; font-size: 0.75rem; color: var(--muted); }
    .progress-card__step { display: flex; align-items: center; gap: 0.25rem; }
    .progress-card__step.is-done { color: #22c55e; }
    .progress-card__step.is-current { color: var(--text); font-weight: 600; }

    /* ── Light mode — same overrides as index.html ── */
    @media (prefers-color-scheme: light) {
      :root {
        --text: #111111;
        --muted: #4a4a4a;
        --card-border: #d5d5d5;
      }
      html, body { background: #f7f7f7; }
      .progress-card { background: #ffffff; }
      .progress-card__track { background: rgba(0,0,0,.08); }
    }
  </style>
</head>
<body>
  <div class="content">
    <div class="progress-card">
      <p class="progress-card__title">Payment received</p>
      <p class="progress-card__subtitle"><strong>Next:</strong> book your onboarding call below</p>
      <div class="progress-card__track">
        <div class="progress-card__fill" style="width: 33%"></div>
      </div>
      <div class="progress-card__steps">
        <span class="progress-card__step is-done">✓ Sign Up</span>
        <span class="progress-card__step is-current">Book Call</span>
        <span class="progress-card__step">Download App</span>
      </div>
    </div>

    <div style="width:100%;height:100%;overflow:scroll;margin-top:1.5rem" id="my-cal-inline-30min"></div>
  </div>

  <!-- Cal inline embed code begins -->
  <script type="text/javascript">
    (function (C, A, L) { let p = function (a, ar) { a.q.push(ar); }; let d = C.document; C.Cal = C.Cal || function () { let cal = C.Cal; let ar = arguments; if (!cal.loaded) { cal.ns = {}; cal.q = cal.q || []; d.head.appendChild(d.createElement("script")).src = A; cal.loaded = true; } if (ar[0] === L) { const api = function () { p(api, arguments); }; const namespace = ar[1]; api.q = api.q || []; if(typeof namespace === "string"){cal.ns[namespace] = cal.ns[namespace] || api;p(cal.ns[namespace], ar);p(cal, ["initNamespace", namespace]);} else p(cal, ar); return;} p(cal, ar); }; })(window, "https://app.cal.com/embed/embed.js", "init");
    Cal("init", "30min", {origin:"https://app.cal.com"});
    // Auto-forwards this page's ?name=&email= (appended by the Stripe
    // success redirect) straight into the booking form — no custom
    // prefill script needed.
    Cal.config = Cal.config || {};
    Cal.config.forwardQueryParams = true;

    Cal.ns["30min"]("inline", {
      elementOrSelector:"#my-cal-inline-30min",
      config: {"layout":"month_view","useSlotsViewOnSmallScreen":"true"},
      calLink: "asherrobinsonfitness/30min",
    });

    Cal.ns["30min"]("ui", {"cssVarsPerTheme":{"light":{"cal-brand":"#0066ff"},"dark":{"cal-brand":"#0066ff"}},"hideEventTypeDetails":true,"layout":"month_view"});

    // Redirect to the booked page ourselves the instant Cal.com reports a
    // completed booking, same reasoning as the prior Calendly/HubSpot
    // integrations: a same-origin redirect we trigger from our own script
    // skips any embed-side confirmation interstitial.
    var params = new URLSearchParams(window.location.search);
    var contactName = params.get('name');
    var contactEmail = params.get('email');
    Cal.ns["30min"]("on", {
      action: "bookingSuccessful",
      callback: function () {
        var qs = [];
        if (contactName) qs.push('name=' + encodeURIComponent(contactName));
        if (contactEmail) qs.push('email=' + encodeURIComponent(contactEmail));
        window.location.href = '/welcome/booked/' + (qs.length ? '?' + qs.join('&') : '');
      }
    });
  </script>
  <!-- Cal inline embed code ends -->
</body>
</html>
